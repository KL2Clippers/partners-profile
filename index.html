<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>거래처 프로파일 통합 관리 시스템</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --bg-app: #f4f6fa;
  --bg-sidebar: #ffffff;
  --bg-card: #ffffff;
  --border-light: #f1f3f7;
  --border-color: #e5e7eb;
  --primary: #1a56db;
  --primary-hover: #1e429f;
  --primary-light: #edf2ff;
  --text-main: #111827;
  --text-muted: #6b7280;
  --text-link: #2563eb;
  --danger: #e53e3e;
  --danger-light: #fff5f5;
  --success-bg: #def7ec;
  --success-text: #03543f;
  --warning-bg: #fde8e8;
  --warning-text: #9b1c1c;
  --radius-md: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg-app); font-family: var(--font-sans); color: var(--text-main); -webkit-font-smoothing: antialiased; letter-spacing: -0.02em; }

.app { display: flex; height: 100vh; overflow: hidden; }

/* 토스 스타일 프리미엄 사이드바 */
.sidebar { width: 300px; flex-shrink: 0; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; background: var(--bg-sidebar); }
.sh { padding: 24px 20px; }
.sh h2 { font-size: 18px; font-weight: 700; color: var(--text-main); margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
.cnt { font-size: 12px; background: var(--primary-light); border-radius: 6px; padding: 2px 8px; color: var(--primary); font-weight: 700; }
.search-wrapper { position: relative; width: 100%; margin-bottom: 12px; }
.search-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 16px; }
.search-box { width: 100%; padding: 11px 12px 11px 38px; font-size: 14px; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: #f9fafb; transition: all 0.2s; }
.search-box:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px var(--primary-light); }
.add-btn { width: 100%; padding: 12px; font-size: 14px; cursor: pointer; background: var(--primary); color: #fff; border: none; border-radius: var(--radius-md); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.2s; box-shadow: var(--shadow-sm); }
.add-btn:hover { background: var(--primary-hover); }

/* 리스트 관리 */
.plist { flex: 1; overflow-y: auto; padding: 0 12px 20px; }
.pi { padding: 14px 16px; border-radius: var(--radius-md); cursor: pointer; margin-bottom: 8px; border: 1px solid transparent; transition: all 0.2s; background: #fff; box-shadow: var(--shadow-sm); }
.pi:hover { background: #f9fafb; transform: translateY(-1px); }
.pi.active { background: var(--primary-light); border-color: var(--primary); }
.pi .pname { font-size: 15px; font-weight: 600; color: var(--text-main); line-height: 1.4; }
.pi .psub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
.sbadge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; margin-top: 10px; }
.s-active { background: var(--success-bg); color: var(--success-text); }
.s-inactive { background: #f3f4f6; color: var(--text-muted); }
.s-pending { background: #feecdc; color: #b45309; }

/* 메인 대시보드 */
.main { flex: 1; overflow-y: auto; background: var(--bg-app); display: flex; flex-direction: column; }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); text-align: center; background: #fff; margin: 20px; border-radius: var(--radius-lg); border: 1px dashed var(--border-color); }
.empty i { font-size: 56px; color: #d1d5db; margin-bottom: 16px; }

/* 상단 탭 매핑 시스템 */
.tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--border-color); background: #fff; padding: 0 32px; position: sticky; top: 0; z-index: 10; }
.tab { padding: 18px 12px; font-size: 15px; cursor: pointer; color: var(--text-muted); border-bottom: 3px solid transparent; display: flex; align-items: center; gap: 8px; font-weight: 500; transition: all 0.15s; }
.tab.on { color: var(--primary); border-bottom-color: var(--primary); font-weight: 700; }
.tab:hover:not(.on) { color: var(--text-main); }

.tab-content { padding: 32px; max-width: 1200px; width: 100%; margin: 0 auto; }

/* 레이아웃 카드 파트 */
.card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 32px; margin-bottom: 24px; box-shadow: var(--shadow-md); }
.ph { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border-light); }
.avatar { width: 64px; height: 64px; border-radius: 14px; background: var(--primary-light); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 22px; color: var(--primary); flex-shrink: 0; }
.pmeta { flex: 1; margin-left: 20px; }
.pmeta h1 { font-size: 24px; font-weight: 700; color: var(--text-main); letter-spacing: -0.03em; }
.pmeta .code { font-size: 14px; color: var(--text-muted); margin-top: 4px; }
.abts { display: flex; gap: 10px; }

/* 공통 정밀 버튼 */
.btn { padding: 10px 18px; font-size: 14px; border-radius: var(--radius-md); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; transition: all 0.2s; border: 1px solid transparent; font-family: var(--font-sans); }
.btn-ed { background: #fff; border-color: var(--border-color); color: var(--text-main); box-shadow: var(--shadow-sm); }
.btn-ed:hover { background: #f9fafb; border-color: #cbd5e1; }
.btn-dl { background: #fff; border-color: #fee2e2; color: var(--danger); }
.btn-dl:hover { background: var(--danger-light); border-color: #fca5a5; }
.btn-save { background: var(--primary); color: #fff; box-shadow: var(--shadow-sm); }
.btn-save:hover { background: var(--primary-hover); }
.btn-cancel { background: #fff; border-color: var(--border-color); color: var(--text-muted); }
.btn-cancel:hover { background: #f3f4f6; color: var(--text-main); }
.btn-add-sm { background: #fff; color: var(--primary); border: 1px solid var(--primary); padding: 6px 14px; font-size: 13px; }
.btn-add-sm:hover { background: var(--primary-light); }

/* 그리드 인프라 구조 */
.sec-label { font-size: 14px; font-weight: 700; color: var(--primary); margin: 32px 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
.sec-label:first-child { margin-top: 0; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px 32px; }
.field label { font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 6px; font-weight: 500; }
.field .val { font-size: 15px; color: var(--text-main); font-weight: 600; line-height: 1.5; }
.field .val a { color: var(--text-link); text-decoration: none; }
.field .val a:hover { text-decoration: underline; }

.memo-box { background: #f9fafb; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 18px 20px; font-size: 14px; color: var(--text-main); line-height: 1.7; white-space: pre-wrap; min-height: 80px; }

/* 인풋 세션 컨테이너 */
.form-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px 20px; }
.fg { display: flex; flex-direction: column; gap: 6px; grid-column: span 4; }
.fg.full { grid-column: span 12; }
.fg.half { grid-column: span 6; }
.fg label { font-size: 13px; color: var(--text-main); font-weight: 600; }
.fg input, .fg select, .fg textarea { padding: 11px 14px; font-size: 14px; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: #fff; color: var(--text-main); font-family: var(--font-sans); transition: all 0.2s; box-shadow: var(--shadow-sm); }
.fg input:focus, .fg select:focus, .fg textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-light); background: #fff; }
.fg textarea { resize: vertical; min-height: 120px; }
.form-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border-color); }

/* 데이터 테이블 원장 */
.trade-table { width: 100%; font-size: 14px; border-collapse: collapse; }
.trade-table th { text-align: left; font-weight: 600; color: var(--text-muted); padding: 14px 16px; border-bottom: 1px solid var(--border-color); background: #f9fafb; }
.trade-table td { padding: 16px 16px; border-bottom: 1px solid var(--border-light); color: var(--text-main); }
.trade-table tr:last-child td { border-bottom: none; }
.trade-table tr:hover td { background: #f9fafb; }
.type-badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; }
.t-buy { background: #e1effe; color: #1e429f; }
.t-sell { background: var(--success-bg); color: var(--success-text); }
.t-other { background: #f3f4f6; color: var(--text-muted); }

/* 미팅 타임라인 로그 */
.tl { position: relative; padding-left: 28px; margin-top: 12px; }
.tl::before { content: ''; position: absolute; left: 5px; top: 10px; bottom: 0; width: 2px; background: var(--border-color); }
.tl-item { position: relative; margin-bottom: 24px; display: flex; align-items: flex-start; justify-content: space-between; }
.tl-dot { position: absolute; left: -28px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 3px solid var(--primary); }
.tl-content-block { flex: 1; padding-right: 20px; }
.tl-date { font-size: 13px; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
.tl-body { background: #f9fafb; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 16px 20px; }
.tl-body .tl-title { font-size: 15px; font-weight: 700; color: var(--text-main); }
.tl-body .tl-detail { font-size: 14px; color: var(--text-muted); margin-top: 6px; line-height: 1.6; }

/* 상단 통계 현황판 */
.sum-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
.sum-card { background: #f9fafb; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 18px 20px; }
.sum-card .slabel { font-size: 13px; color: var(--text-muted); font-weight: 600; }
.sum-card .sval { font-size: 22px; font-weight: 700; color: var(--text-main); margin-top: 6px; letter-spacing: -0.02em; }

/* 알림판 토스트 */
.toast { position: fixed; bottom: 32px; right: 32px; background: #1f2937; border-radius: var(--radius-md); padding: 14px 24px; font-size: 14px; color: #fff; opacity: 0; transform: translateY(10px); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 200; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
.toast.show { opacity: 1; transform: translateY(0); }
.row-del { font-size: 16px; cursor: pointer; color: var(--text-muted); border: none; background: none; padding: 6px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s; }
.row-del:hover { color: var(--danger); background: var(--danger-light); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
</style>
</head>
<body>

<h2 class="sr-only">거래처 프로파일 통합 관리 시스템</h2>
<div class="app">
  <div class="sidebar">
    <div class="sh">
      <h2>거래처 목록 <span class="cnt" id="cnt">0</span></h2>
      <div class="search-wrapper">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input class="search-box" id="search" placeholder="거래처명 또는 코드로 검색..." oninput="renderList()"/>
      </div>
      <button class="add-btn" onclick="openNew()"><i class="ti ti-plus" aria-hidden="true"></i>새 거래처 등록</button>
    </div>
    <div class="plist" id="plist"></div>
  </div>

  <div class="main" id="main">
    <div class="empty" id="empty-state">
      <i class="ti ti-building-carousel" aria-hidden="true"></i>
      <p style="font-size:16px; font-weight:700; color:var(--text-main);">선택된 대시보드가 없습니다</p>
      <p style="font-size:14px; color:var(--text-muted); margin-top:4px;">왼쪽 리스트에서 기업을 선택하거나 시스템에 등록하세요.</p>
    </div>

    <div id="detail-wrap" style="display:none;">
      <div class="tabs" id="tabs-bar">
        <div class="tab on" data-tab="info" onclick="switchTab('info')"><i class="ti ti-id" aria-hidden="true"></i>기본정보</div>
        <div class="tab" data-tab="trade" onclick="switchTab('trade')"><i class="ti ti-businessplan" aria-hidden="true"></i>거래/결제조건</div>
        <div class="tab" data-tab="history" onclick="switchTab('history')"><i class="ti ti-report-money" aria-hidden="true"></i>매입/매출 원장</div>
        <div class="tab" data-tab="timeline" onclick="switchTab('timeline')"><i class="ti ti-timeline-event" aria-hidden="true"></i>히스토리 로그</div>
      </div>
      <div class="tab-content" id="tab-info"></div>
      <div class="tab-content" id="tab-trade" style="display:none;"></div>
      <div class="tab-content" id="tab-history" style="display:none;"></div>
      <div class="tab-content" id="tab-timeline" style="display:none;"></div>
    </div>

    <div id="form-wrap" style="display:none;"><div class="tab-content" id="form-content"></div></div>
  </div>
</div>

<div class="toast" id="toast"><i class="ti ti-discount-check-filled" style="color:#34d399; font-size:18px;" aria-hidden="true"></i><span id="toast-msg"></span></div>

<script>
const SK='tp_full_v3';
let partners=[], selId=null, curTab='info';

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function initials(n){return (n||'?').replace(/[()（）주식회사㈜]/g,'').trim().slice(0,2).toUpperCase();}
function fmt(n){if(!n)return'—';return Number(n).toLocaleString();}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function statusBadge(s){
  if(s==='active')return'<span class="sbadge s-active">거래중</span>';
  if(s==='inactive')return'<span class="sbadge s-inactive">거래중단</span>';
  return'<span class="sbadge s-pending">협의중</span>';
}

// 🛠️ 치명적 버그 수정 1: 모든 데이터 필드가 완벽한 객체 형태로 존재하도록 초기셋 보정
function load(){
  try {
    const raw = localStorage.getItem(SK);
    if(raw) partners = JSON.parse(raw);
  } catch(e) {
    partners = [];
  }
  
  if(!partners || !partners.length){
    partners=[
      {id:uid(),code:'A-001',name:'(주)대한무역',category:'도매업',status:'active',ceo:'이대한',founded:'2005',bizNo:'123-45-67890',address:'서울시 중구 을지로 100',contact:'김철수',ctitle:'부장',phone:'02-1234-5678',mobile:'010-1234-5678',email:'kim@daehan.co.kr',
      payTerms:'월말 결제',payMethod:'계좌이체',creditLimit:'50000000',currency:'KRW',tradeStart:'2018-03-01',bank:'국민은행',accountNo:'123-456-789012',accountHolder:'(주)대한무역',
      incoterms:'FOB',hsCode:'8517.12',origin:'KR',portLoad:'부산항',portDisch:'',
      tradeHistory:[
        {id:uid(),date:'2024-11-15',type:'sell',item:'전자부품 A',qty:'500',unit:'EA',amount:'12500000',note:'정기납품'},
        {id:uid(),date:'2024-08-20',type:'sell',item:'전자부품 B',qty:'200',unit:'EA',amount:'8000000',note:''},
      ],
      timeline:[
        {id:uid(),date:'2024-11-20',title:'4분기 공급 단가 협의 조율',detail:'글로벌 원자재 인상분 반영 내년 1분기까지 최종 동결 합의.'},
        {id:uid(),date:'2024-06-01',title:'사내 여신 리스크 한도 증액 검토',detail:'신용평가 보고서 검토 후 기존 3천만에서 5천만원으로 상향 조정 완료.'}
      ],
      notes:'해외사업부 메인 핵심 계정 유통 파트너사. 환율 변동 추이 상시 연동 필수.'},
      {id:uid(),code:'B-002',name:'글로벌테크 Inc.',category:'무역업',status:'active',ceo:'James Park',founded:'2012',bizNo:'US-987654321',address:'1234 Tech Blvd, Los Angeles, CA',contact:'Sarah Kim',ctitle:'Manager',phone:'+1-310-555-0101',mobile:'+1-310-555-0102',email:'sarah@globaltech.com',
      payTerms:'Net 30',payMethod:'Wire Transfer',creditLimit:'100000',currency:'USD',tradeStart:'2020-06-15',bank:'Bank of America',accountNo:'9876543210',accountHolder:'GlobalTech Inc.',
      incoterms:'CIF',hsCode:'8542.31',origin:'US',portLoad:'Los Angeles',portDisch:'부산항',
      tradeHistory:[
        {id:uid(),date:'2024-12-01',type:'buy',item:'반도체 메인보드 칩셋',qty:'1000',unit:'EA',amount:'85000',note:'USD 외화 송금'}
      ],
      timeline:[
        {id:uid(),date:'2024-09-10',title:'대금 지불 가이드라인 변경 협의',detail:'기존 Sight L/C 구조에서 여신 유연화 전략에 의거 Usance 30일로 연장 성립.'}
      ],
      notes:'통관 보관 기일 체킹 요망. 반기별 바이어 벤더 리스크 정기 평가 대상 계정.'}
    ];
    save();
  }
  renderList();
}

function save(){
  try {
    localStorage.setItem(SK, JSON.stringify(partners));
  } catch(e) {}
}

function renderList(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const filtered=partners.filter(p=>p.name.toLowerCase().includes(q)||(p.code||'').toLowerCase().includes(q));
  document.getElementById('cnt').textContent=partners.length;
  document.getElementById('plist').innerHTML=filtered.length===0
    ?'<p style="font-size:14px;color:var(--text-muted);text-align:center;padding:32px 0;">검색 매칭 결과 없음</p>'
    :filtered.map(p=>`<div class="pi ${selId===p.id?'active':''}" onclick="selectP('${p.id}')">
      <div class="pname">${esc(p.name)}</div>
      <div class="psub">${esc(p.code||'')}${p.category?' · '+esc(p.category):''}</div>
      ${statusBadge(p.status)}
    </div>`).join('');
}

function selectP(id){
  selId=id;curTab='info';
  renderList();showDetail();
}

function switchTab(t){
  curTab=t;
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('on',el.dataset.tab===t));
  ['info','trade','history','timeline'].forEach(n=>{
    document.getElementById('tab-'+n).style.display=(n===t?'block':'none');
  });
  const p=partners.find(x=>x.id===selId);
  if(!p)return;
  if(t==='info')renderInfo(p);
  else if(t==='trade')renderTrade(p);
  else if(t==='history')renderHistory(p);
  else if(t==='timeline')renderTimeline(p);
}

function showDetail(){
  const p=partners.find(x=>x.id===selId);
  if(!p)return;
  document.getElementById('empty-state').style.display='none';
  document.getElementById('form-wrap').style.display='none';
  document.getElementById('detail-wrap').style.display='block';
  switchTab(curTab);
}

function renderInfo(p){
  const el=document.getElementById('tab-info');
  el.innerHTML=`
  <div class="card">
    <div class="ph">
      <div style="display:flex;align-items:center;gap:18px;flex:1;">
        <div class="avatar">${initials(p.name)}</div>
        <div class="pmeta">
          <h1>${esc(p.name)}</h1>
          <div class="code">${esc(p.code||'')}${p.category?' · '+esc(p.category):''}</div>
          <div>${statusBadge(p.status)}</div>
        </div>
      </div>
      <div class="abts">

function f(label,val){return`<div class="field"><label>${label}</label><div class="val">${val||'—'}</div></div>`;}
function fe(label,val){return`<div class="field"><label>${label}</label><div class="val">${val?`<a href="mailto:${esc(val)}">${esc(val)}</a>`:'—'}</div></div>`;}
function fi(id,label,type,val,cls=''){return`<div class="fg ${cls}"><label>${label}</label><input id="f-${id}" type="${type}" value="${esc(val||'')}"/></div>`;}
function sel(id,label,val,opts){return`<div class="fg"><label>${label}</label><select id="f-${id}">${opts.map(o=>`<option value="${o[0]}" ${val===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>`;}
function gv(id){const e=document.getElementById('f-'+id);return e?e.value.trim():'';}

function openAddHistory(){document.getElementById('add-history-form').style.display='block';document.getElementById('f-h-date').value=new Date().toISOString().slice(0,10);}
function openAddTimeline(){document.getElementById('add-tl-form').style.display='block';document.getElementById('f-tl-date').value=new Date().toISOString().slice(0,10);}

function saveHistory(){
  const p=partners.find(x=>x.id===selId);if(!p)return;
  if(!p.tradeHistory) p.tradeHistory=[];
  p.tradeHistory.unshift({id:uid(),date:gv('h-date'),type:gv('h-type'),item:gv('h-item'),qty:gv('h-qty'),unit:gv('h-unit'),amount:gv('h-amount'),note:gv('h-note')});
  save();renderHistory(p);showToast('신규 회계 전표 내역이 성공적으로 누적되었습니다.');
}

function delHistory(hid){
  const p=partners.find(x=>x.id===selId);if(!p)return;
  p.tradeHistory=(p.tradeHistory||[]).filter(h=>h.id!==hid);
  save();renderHistory(p);showToast('데이터 전표 라인이 삭제 처리되었습니다.');
}

function saveTL(){
  const p=partners.find(x=>x.id===selId);if(!p)return;
  if(!p.timeline) p.timeline=[];
  const detail=document.getElementById('f-tl-detail')?.value.trim()||'';
  p.timeline.unshift({id:uid(),date:gv('tl-date'),title:gv('tl-title'),detail});
  save();renderTimeline(p);showToast('안건 마일스톤이 교섭 내역 타임라인에 저장되었습니다.');
}

function delTimeline(tid){
  const p=partners.find(x=>x.id===selId);if(!p)return;
  p.timeline=(p.timeline||[]).filter(t=>t.id!==tid);
  save();renderTimeline(p);showToast('로그 이력이 완벽히 제거되었습니다.');
}

function saveForm(eid){
  const name=gv('name');
  if(!name){
    alert('식별 처리를 위해 거래처 법인명은 공백으로 둘 수 없습니다.');
    return;
  }
  
  const orig = eid ? partners.find(x=>x.id===eid) : null;
  const data = {
    id: eid || uid(),
    name,
    code: gv('code'),
    category: document.getElementById('f-category').value,
    status: document.getElementById('f-status').value,
    ceo: gv('ceo'),
    founded: gv('founded'),
    bizNo: gv('bizNo'),
    address: gv('address'),
    contact: gv('contact'),
    ctitle: gv('ctitle'),
    phone: gv('phone'),
    mobile: gv('mobile'),
    email: gv('email'),
    payTerms: gv('payTerms'),
    payMethod: gv('payMethod'),
    creditLimit: gv('creditLimit'),
    currency: gv('currency'),
    tradeStart: gv('tradeStart'),
    bank: gv('bank'),
    accountNo: gv('accountNo'),
    accountHolder: gv('accountHolder'),
    incoterms: document.getElementById('f-incoterms').value,
    hsCode: gv('hsCode'),
    origin: gv('origin'),
    portLoad: gv('portLoad'),
    portDisch: gv('portDisch'),
    notes: document.getElementById('f-notes')?.value.trim() || '',
    tradeHistory: orig ? orig.tradeHistory || [] : [],
    timeline: orig ? orig.timeline || [] : []
  };
  
  if(eid){
    const i = partners.findIndex(x=>x.id===eid);
    if(i>-1) partners[i] = data;
  } else {
    partners.unshift(data);
  }
  
  selId = data.id;
  curTab = 'info';
  save();
  renderList();
  showDetail();
  showToast('전산망 정보 허브 마스터에 성공적으로 동기화 처리 완료.');
}

function cancelForm(eid){
  document.getElementById('form-wrap').style.display='none';
  if(eid && partners.find(x=>x.id===eid)){
    selId = eid;
    showDetail();
  } else {
    document.getElementById('empty-state').style.display='flex';
  }
}

function deleteP(){
  const p=partners.find(x=>x.id===selId);if(!p)return;
  if(!confirm(`"${p.name}" 계정의 모든 마스터 데이터를 전산망 허브에서 파기하시겠습니까?`))return;
  partners=partners.filter(x=>x.id!==selId);
  selId=null;
  save();
  renderList();
  document.getElementById('detail-wrap').style.display='none';
  document.getElementById('empty-state').style.display='flex';
  showToast('로그 계정 완전 격리 파기 완료.');
}

function showToast(msg){
  const t=document.getElementById('toast');
  document.getElementById('toast-msg').textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

// 🛠️ 치명적 버그 수정 3: 화면을 모두 다 안전하게 그리고 나서 코드를 안전하게 주입
window.addEventListener('DOMContentLoaded', load);
</script>
