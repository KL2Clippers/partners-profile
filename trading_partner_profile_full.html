
<style>
*{box-sizing:border-box;margin:0;padding:0;}
.app{display:flex;height:100vh;min-height:640px;font-family:var(--font-sans);}
.sidebar{width:232px;flex-shrink:0;border-right:0.5px solid var(--color-border-tertiary);display:flex;flex-direction:column;background:var(--color-background-secondary);}
.sh{padding:14px 12px;border-bottom:0.5px solid var(--color-border-tertiary);}
.sh h2{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.cnt{font-size:11px;background:var(--color-background-tertiary);border:0.5px solid var(--color-border-tertiary);border-radius:20px;padding:1px 7px;color:var(--color-text-secondary);}
.search-box{width:100%;padding:6px 10px;font-size:12px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);}
.search-box:focus{outline:none;box-shadow:0 0 0 2px var(--color-border-info);}
.add-btn{width:100%;margin-top:7px;padding:6px;font-size:12px;cursor:pointer;background:var(--color-background-info);color:var(--color-text-info);border:none;border-radius:var(--border-radius-md);font-weight:500;display:flex;align-items:center;justify-content:center;gap:5px;}
.add-btn:hover{opacity:0.85;}
.plist{flex:1;overflow-y:auto;padding:6px;}
.pi{padding:9px 10px;border-radius:var(--border-radius-md);cursor:pointer;margin-bottom:3px;border:0.5px solid transparent;}
.pi:hover{background:var(--color-background-primary);border-color:var(--color-border-tertiary);}
.pi.active{background:var(--color-background-primary);border-color:var(--color-border-secondary);}
.pi .pname{font-size:13px;font-weight:500;color:var(--color-text-primary);}
.pi .psub{font-size:11px;color:var(--color-text-secondary);margin-top:2px;}
.sbadge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:20px;margin-top:4px;}
.s-active{background:var(--color-background-success);color:var(--color-text-success);}
.s-inactive{background:var(--color-background-secondary);color:var(--color-text-secondary);border:0.5px solid var(--color-border-secondary);}
.s-pending{background:var(--color-background-warning);color:var(--color-text-warning);}
.main{flex:1;overflow-y:auto;background:var(--color-background-tertiary);}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--color-text-secondary);gap:10px;}
.empty i{font-size:36px;}
.tabs{display:flex;gap:0;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);padding:0 20px;}
.tab{padding:12px 14px;font-size:13px;cursor:pointer;color:var(--color-text-secondary);border-bottom:2px solid transparent;margin-bottom:-0.5px;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.tab.on{color:var(--color-text-primary);border-bottom-color:var(--color-text-primary);font-weight:500;}
.tab:hover:not(.on){color:var(--color-text-primary);}
.tab-content{padding:20px;}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:18px 20px;margin-bottom:14px;}
.sec-label{font-size:12px;font-weight:500;color:var(--color-text-secondary);margin:16px 0 10px;padding-bottom:6px;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;gap:6px;}
.sec-label:first-child{margin-top:0;}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 20px;}
.field label{font-size:11px;color:var(--color-text-secondary);display:block;margin-bottom:2px;}
.field .val{font-size:13px;color:var(--color-text-primary);}
.field .val a{color:var(--color-text-info);text-decoration:none;}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--color-background-info);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:16px;color:var(--color-text-info);flex-shrink:0;}
.pmeta{flex:1;margin-left:12px;}
.pmeta h1{font-size:18px;font-weight:500;color:var(--color-text-primary);}
.pmeta .code{font-size:12px;color:var(--color-text-secondary);margin-top:2px;}
.abts{display:flex;gap:7px;}
.btn{padding:6px 12px;font-size:12px;border-radius:var(--border-radius-md);cursor:pointer;display:flex;align-items:center;gap:5px;font-family:var(--font-sans);}
.btn-ed{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);color:var(--color-text-primary);}
.btn-ed:hover{background:var(--color-background-secondary);}
.btn-dl{background:var(--color-background-primary);border:0.5px solid var(--color-border-danger);color:var(--color-text-danger);}
.btn-dl:hover{background:var(--color-background-danger);}
.btn-save{background:var(--color-background-info);border:none;color:var(--color-text-info);font-weight:500;}
.btn-save:hover{opacity:0.85;}
.btn-cancel{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);color:var(--color-text-secondary);}
.btn-add-sm{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);color:var(--color-text-primary);font-size:12px;}
.btn-add-sm:hover{background:var(--color-background-secondary);}
.memo-box{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:11px 13px;font-size:13px;color:var(--color-text-primary);line-height:1.6;white-space:pre-wrap;min-height:40px;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 14px;}
.fg{display:flex;flex-direction:column;gap:3px;}
.fg.full{grid-column:1/-1;}
.fg label{font-size:11px;color:var(--color-text-secondary);}
.fg input,.fg select,.fg textarea{padding:6px 9px;font-size:12px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);font-family:var(--font-sans);}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;box-shadow:0 0 0 2px var(--color-border-info);}
.fg textarea{resize:vertical;min-height:68px;}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
.trade-table{width:100%;font-size:12px;border-collapse:collapse;}
.trade-table th{text-align:left;font-weight:500;color:var(--color-text-secondary);padding:6px 10px;border-bottom:0.5px solid var(--color-border-tertiary);white-space:nowrap;}
.trade-table td{padding:8px 10px;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-primary);vertical-align:middle;}
.trade-table tr:last-child td{border-bottom:none;}
.trade-table tr:hover td{background:var(--color-background-secondary);}
.type-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;}
.t-buy{background:var(--color-background-info);color:var(--color-text-info);}
.t-sell{background:var(--color-background-success);color:var(--color-text-success);}
.t-other{background:var(--color-background-secondary);color:var(--color-text-secondary);border:0.5px solid var(--color-border-secondary);}
.tl{position:relative;padding-left:20px;}
.tl::before{content:'';position:absolute;left:6px;top:8px;bottom:0;width:1px;background:var(--color-border-secondary);}
.tl-item{position:relative;margin-bottom:14px;}
.tl-dot{position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--color-background-info);border:2px solid var(--color-border-info);}
.tl-date{font-size:11px;color:var(--color-text-secondary);margin-bottom:2px;}
.tl-body{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:9px 12px;}
.tl-body .tl-title{font-size:13px;font-weight:500;color:var(--color-text-primary);}
.tl-body .tl-detail{font-size:12px;color:var(--color-text-secondary);margin-top:3px;}
.file-list{display:flex;flex-direction:column;gap:8px;}
.file-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);}
.file-info{display:flex;align-items:center;gap:9px;}
.file-icon{font-size:20px;color:var(--color-text-secondary);}
.file-name{font-size:13px;color:var(--color-text-primary);}
.file-meta{font-size:11px;color:var(--color-text-secondary);margin-top:1px;}
.file-del{font-size:14px;color:var(--color-text-secondary);cursor:pointer;padding:4px;border:none;background:none;}
.file-del:hover{color:var(--color-text-danger);}
.upload-area{border:1px dashed var(--color-border-secondary);border-radius:var(--border-radius-md);padding:20px;text-align:center;cursor:pointer;transition:background 0.15s;}
.upload-area:hover{background:var(--color-background-secondary);}
.upload-area i{font-size:24px;color:var(--color-text-secondary);}
.upload-area p{font-size:12px;color:var(--color-text-secondary);margin-top:6px;}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.sum-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:12px 14px;}
.sum-card .slabel{font-size:11px;color:var(--color-text-secondary);}
.sum-card .sval{font-size:18px;font-weight:500;color:var(--color-text-primary);margin-top:4px;}
.toast{position:fixed;bottom:18px;right:18px;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:9px 15px;font-size:12px;color:var(--color-text-primary);opacity:0;transition:opacity 0.3s;z-index:200;display:flex;align-items:center;gap:7px;}
.toast.show{opacity:1;}
.row-del{font-size:13px;cursor:pointer;color:var(--color-text-secondary);border:none;background:none;padding:2px 5px;}
.row-del:hover{color:var(--color-text-danger);}
</style>

<h2 class="sr-only">거래처 프로파일 통합 관리 시스템</h2>
<div class="app">
  <div class="sidebar">
    <div class="sh">
      <h2>거래처 관리 <span class="cnt" id="cnt">0</span></h2>
      <input class="search-box" id="search" placeholder="거래처명·코드 검색..." oninput="renderList()"/>
      <button class="add-btn" onclick="openNew()"><i class="ti ti-plus" aria-hidden="true"></i>새 거래처 추가</button>
    </div>
    <div class="plist" id="plist"></div>
  </div>
  <div class="main" id="main">
    <div class="empty" id="empty-state">
      <i class="ti ti-building-store" aria-hidden="true"></i>
      <p style="font-size:14px;font-weight:500;">거래처를 선택하거나 새로 추가하세요</p>
      <p style="font-size:12px;">왼쪽 목록에서 거래처를 클릭하면 상세 정보를 볼 수 있어요</p>
    </div>
    <div id="detail-wrap" style="display:none;">
      <div class="tabs" id="tabs-bar">
        <div class="tab on" data-tab="info" onclick="switchTab('info')"><i class="ti ti-user" aria-hidden="true"></i>기본정보</div>
        <div class="tab" data-tab="trade" onclick="switchTab('trade')"><i class="ti ti-coin" aria-hidden="true"></i>거래조건</div>
        <div class="tab" data-tab="history" onclick="switchTab('history')"><i class="ti ti-list" aria-hidden="true"></i>거래이력</div>
        <div class="tab" data-tab="timeline" onclick="switchTab('timeline')"><i class="ti ti-timeline" aria-hidden="true"></i>히스토리</div>
        <div class="tab" data-tab="files" onclick="switchTab('files')"><i class="ti ti-paperclip" aria-hidden="true"></i>첨부파일</div>
      </div>
      <div class="tab-content" id="tab-info"></div>
      <div class="tab-content" id="tab-trade" style="display:none;"></div>
      <div class="tab-content" id="tab-history" style="display:none;"></div>
      <div class="tab-content" id="tab-timeline" style="display:none;"></div>
      <div class="tab-content" id="tab-files" style="display:none;"></div>
    </div>
    <div id="form-wrap" style="display:none;"><div class="tab-content" id="form-content"></div></div>
  </div>
</div>
<div class="toast" id="toast"><i class="ti ti-check" style="color:var(--color-text-success)" aria-hidden="true"></i><span id="toast-msg"></span></div>

<script>
const SK='tp_full_v3';
let partners=[], selId=null, curTab='info';

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function initials(n){return (n||'?').replace(/[()（）주식회사㈜]/g,'').trim().slice(0,2).toUpperCase();}
function fmt(n){if(!n)return'—';return Number(n).toLocaleString();}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function statusBadge(s){
  if(s==='active')return'<span class="sbadge s-active">거래중</span>';
  if(s==='inactive')return'<span class="sbadge s-inactive">거래중단</span>';
  return'<span class="sbadge s-pending">협의중</span>';
}

async function load(){
  try{const r=await window.storage.get(SK);if(r&&r.value)partners=JSON.parse(r.value);}catch(e){partners=[];}
  if(!partners.length){
    partners=[
      {id:uid(),code:'A-001',name:'(주)대한무역',category:'도매업',status:'active',ceo:'이대한',founded:'2005',bizNo:'123-45-67890',address:'서울시 중구 을지로 100',contact:'김철수',ctitle:'부장',phone:'02-1234-5678',mobile:'010-1234-5678',email:'kim@daehan.co.kr',
      payTerms:'월말 결제',payMethod:'계좌이체',creditLimit:'50000000',currency:'KRW',tradeStart:'2018-03-01',bank:'국민은행',accountNo:'123-456-789012',accountHolder:'(주)대한무역',
      incoterms:'FOB',hsCode:'8517.12',origin:'KR',portLoad:'부산항',portDisch:'',
      tradeHistory:[
        {id:uid(),date:'2024-11-15',type:'sell',item:'전자부품 A',qty:'500',unit:'EA',amount:'12500000',note:'정기납품'},
        {id:uid(),date:'2024-08-20',type:'sell',item:'전자부품 B',qty:'200',unit:'EA',amount:'8000000',note:''},
      ],
      timeline:[
        {id:uid(),date:'2024-11-20',title:'4분기 단가 협의 완료',detail:'내년 1분기까지 동결 합의'},
        {id:uid(),date:'2024-06-01',title:'여신 한도 증액',detail:'3천만 → 5천만원 조정'},
        {id:uid(),date:'2018-03-01',title:'첫 거래 개시',detail:'MOU 체결 후 정식 거래 시작'},
      ],
      files:[],
      notes:'주요 납품처. 분기별 단가 협의 필요.\n신용도 우수.'},
      {id:uid(),code:'B-002',name:'글로벌테크 Inc.',category:'무역업',status:'active',ceo:'James Park',founded:'2012',bizNo:'US-987654321',address:'1234 Tech Blvd, Los Angeles, CA',contact:'Sarah Kim',ctitle:'Manager',phone:'+1-310-555-0101',mobile:'+1-310-555-0102',email:'sarah@globaltech.com',
      payTerms:'Net 30',payMethod:'Wire Transfer',creditLimit:'100000',currency:'USD',tradeStart:'2020-06-15',bank:'Bank of America',accountNo:'9876543210',accountHolder:'GlobalTech Inc.',
      incoterms:'CIF',hsCode:'8542.31',origin:'US',portLoad:'Los Angeles',portDisch:'부산항',
      tradeHistory:[
        {id:uid(),date:'2024-12-01',type:'buy',item:'반도체 칩셋',qty:'1000',unit:'EA',amount:'85000',note:'USD'},
      ],
      timeline:[
        {id:uid(),date:'2024-09-10',title:'L/C 조건 협의',detail:'Sight L/C → Usance 30일로 변경'},
        {id:uid(),date:'2020-06-15',title:'첫 거래 개시',detail:'수입 계약 체결'},
      ],
      files:[],
      notes:'L/C 조건 검토 필요. 반기별 실적 리뷰.'}
    ];
    await save();
  }
  renderList();
}

async function save(){
  try{await window.storage.set(SK,JSON.stringify(partners));}catch(e){}
}

function renderList(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const filtered=partners.filter(p=>p.name.toLowerCase().includes(q)||(p.code||'').toLowerCase().includes(q));
  document.getElementById('cnt').textContent=partners.length;
  document.getElementById('plist').innerHTML=filtered.length===0
    ?'<p style="font-size:12px;color:var(--color-text-secondary);text-align:center;padding:16px;">결과 없음</p>'
    :filtered.map(p=>`<div class="pi ${selId===p.id?'active':''}" onclick="selectP('${p.id}')">
      <div class="pname">${esc(p.name)}</div>
      <div class="psub">${esc(p.code||'')}${p.category?' · '+esc(p.category):''}</div>
      ${statusBadge(p.status)}
    </div>`).join('');
}

function selectP(id){
  selId=id;curTab='info';
  renderList();showDetail();
}

function switchTab(t){
  curTab=t;
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('on',el.dataset.tab===t));
  ['info','trade','history','timeline','files'].forEach(n=>{
    document.getElementById('tab-'+n).style.display=(n===t?'block':'none');
  });
  const p=partners.find(x=>x.id===selId);
  if(!p)return;
  if(t==='info')renderInfo(p);
  else if(t==='trade')renderTrade(p);
  else if(t==='history')renderHistory(p);
  else if(t==='timeline')renderTimeline(p);
  else if(t==='files')renderFiles(p);
}

function showDetail(){
  const p=partners.find(x=>x.id===selId);
  if(!p)return;
  document.getElementById('empty-state').style.display='none';
  document.getElementById('form-wrap').style.display='none';
  document.getElementById('detail-wrap').style.display='block';
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('on',el.dataset.tab===curTab));
  ['info','trade','history','timeline','files'].forEach(n=>{
    document.getElementById('tab-'+n).style.display=(n===curTab?'block':'none');
  });
  switchTab(curTab);
}

function renderInfo(p){
  const el=document.getElementById('tab-info');
  el.innerHTML=`
  <div class="card">
    <div class="ph">
      <div style="display:flex;align-items:center;gap:12px;flex:1;">
        <div class="avatar">${initials(p.name)}</div>
        <div class="pmeta">
          <h1>${esc(p.name)}</h1>
          <div class="code">${esc(p.code||'')}${p.category?' · '+esc(p.category):''}</div>
          <div style="margin-top:5px;">${statusBadge(p.status)}</div>
        </div>
      </div>
      <div class="abts">
        <button class="btn btn-ed" onclick="openEdit()"><i class="ti ti-edit" aria-hidden="true"></i>편집</button>
        <button class="btn btn-dl" onclick="deleteP()"><i class="ti ti-trash" aria-hidden="true"></i>삭제</button>
      </div>
    </div>
    <div class="sec-label"><i class="ti ti-building" aria-hidden="true"></i>기업 정보</div>
    <div class="fgrid">
      ${f('대표자',p.ceo)}${f('설립연도',p.founded)}${f('사업자번호',p.bizNo)}${f('주소',p.address)}
    </div>
    <div class="sec-label" style="margin-top:14px;"><i class="ti ti-user" aria-hidden="true"></i>담당자</div>
    <div class="fgrid">
      ${f('담당자',p.contact+(p.ctitle?' ('+p.ctitle+')':''))}${f('대표전화',p.phone)}${f('휴대폰',p.mobile)}${fe('이메일',p.email)}
    </div>
    ${p.notes?`<div class="sec-label" style="margin-top:14px;"><i class="ti ti-notes" aria-hidden="true"></i>메모</div><div class="memo-box">${esc(p.notes)}</div>`:''}
  </div>`;
}

function renderTrade(p){
  const el=document.getElementById('tab-trade');
  el.innerHTML=`
  <div class="card">
    <div class="sec-label"><i class="ti ti-coin" aria-hidden="true"></i>결제 조건</div>
    <div class="fgrid">
      ${f('결제 조건',p.payTerms)}${f('결제 방법',p.payMethod)}${f('여신 한도',p.creditLimit?Number(p.creditLimit).toLocaleString():'')}${f('통화',p.currency)}${f('거래 개시일',p.tradeStart)}
    </div>
    <div class="sec-label" style="margin-top:14px;"><i class="ti ti-building-bank" aria-hidden="true"></i>은행 계좌</div>
    <div class="fgrid">
      ${f('은행명',p.bank)}${f('계좌번호',p.accountNo)}${f('예금주',p.accountHolder)}
    </div>
    <div class="sec-label" style="margin-top:14px;"><i class="ti ti-ship" aria-hidden="true"></i>수출입 조건</div>
    <div class="fgrid">
      ${f('Incoterms',p.incoterms)}${f('HS 코드',p.hsCode)}${f('원산지',p.origin)}${f('선적항',p.portLoad)}${f('도착항',p.portDisch)}
    </div>
  </div>`;
}

function renderHistory(p){
  const el=document.getElementById('tab-history');
  const hist=p.tradeHistory||[];
  const totalBuy=hist.filter(h=>h.type==='buy').reduce((s,h)=>s+Number(h.amount||0),0);
  const totalSell=hist.filter(h=>h.type==='sell').reduce((s,h)=>s+Number(h.amount||0),0);
  el.innerHTML=`
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <span class="sec-label" style="margin:0;border:none;padding:0;"><i class="ti ti-list" aria-hidden="true"></i>거래 이력</span>
      <button class="btn btn-add-sm" onclick="openAddHistory()"><i class="ti ti-plus" aria-hidden="true"></i>이력 추가</button>
    </div>
    <div class="sum-grid">
      <div class="sum-card"><div class="slabel">총 매입액</div><div class="sval">${totalBuy.toLocaleString()}</div></div>
      <div class="sum-card"><div class="slabel">총 매출액</div><div class="sval">${totalSell.toLocaleString()}</div></div>
      <div class="sum-card"><div class="slabel">거래 건수</div><div class="sval">${hist.length}건</div></div>
    </div>
    ${hist.length===0?'<p style="font-size:12px;color:var(--color-text-secondary);text-align:center;padding:20px 0;">거래 이력이 없어요</p>':`
    <div style="overflow-x:auto;">
    <table class="trade-table">
      <thead><tr>
        <th>날짜</th><th>구분</th><th>품목</th><th>수량</th><th>단위</th><th style="text-align:right;">금액</th><th>비고</th><th></th>
      </tr></thead>
      <tbody>
        ${hist.map(h=>`<tr>
          <td>${esc(h.date)}</td>
          <td><span class="type-badge ${h.type==='buy'?'t-buy':h.type==='sell'?'t-sell':'t-other'}">${h.type==='buy'?'매입':h.type==='sell'?'매출':'기타'}</span></td>
          <td>${esc(h.item)}</td>
          <td>${esc(h.qty)}</td>
          <td>${esc(h.unit)}</td>
          <td style="text-align:right;">${Number(h.amount||0).toLocaleString()}</td>
          <td style="color:var(--color-text-secondary);">${esc(h.note)}</td>
          <td><button class="row-del" onclick="delHistory('${h.id}')"><i class="ti ti-x" aria-hidden="true"></i></button></td>
        </tr>`).join('')}
      </tbody>
    </table></div>`}
  </div>
  <div class="card" id="add-history-form" style="display:none;">
    <div class="sec-label" style="margin-top:0;"><i class="ti ti-plus" aria-hidden="true"></i>거래 이력 추가</div>
    <div class="form-grid">
      ${fi('h-date','날짜','date','')}${sel('h-type','구분','',[['buy','매입'],['sell','매출'],['other','기타']])}${fi('h-item','품목','text','')}${fi('h-qty','수량','text','')}${fi('h-unit','단위','text','EA')}${fi('h-amount','금액','number','')}${fi('h-note','비고','text','')}
    </div>
    <div class="form-actions">
      <button class="btn btn-cancel" onclick="document.getElementById('add-history-form').style.display='none'">취소</button>
      <button class="btn btn-save" onclick="saveHistory()"><i class="ti ti-device-floppy" aria-hidden="true"></i>저장</button>
    </div>
  </div>`;
}

function renderTimeline(p){
  const el=document.getElementById('tab-timeline');
  const tl=(p.timeline||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  el.innerHTML=`
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <span class="sec-label" style="margin:0;border:none;padding:0;"><i class="ti ti-timeline" aria-hidden="true"></i>거래처 히스토리</span>
      <button class="btn btn-add-sm" onclick="openAddTimeline()"><i class="ti ti-plus" aria-hidden="true"></i>항목 추가</button>
    </div>
    ${tl.length===0?'<p style="font-size:12px;color:var(--color-text-secondary);text-align:center;padding:20px 0;">히스토리가 없어요</p>':`
    <div class="tl">
      ${tl.map(t=>`<div class="tl-item">
        <div class="tl-dot"></div>
        <div class="tl-date">${esc(t.date)}</div>
        <div class="tl-body">
          <div class="tl-title">${esc(t.title)}</div>
          ${t.detail?`<div class="tl-detail">${esc(t.detail)}</div>`:''}
        </div>
        <button class="row-del" style="margin-top:4px;" onclick="delTimeline('${t.id}')"><i class="ti ti-x" aria-hidden="true"></i></button>
      </div>`).join('')}
    </div>`}
  </div>
  <div class="card" id="add-tl-form" style="display:none;">
    <div class="sec-label" style="margin-top:0;"><i class="ti ti-plus" aria-hidden="true"></i>히스토리 추가</div>
    <div class="form-grid">
      ${fi('tl-date','날짜','date','')}${fi('tl-title','제목','text','')}
      <div class="fg full"><label>내용</label><textarea id="f-tl-detail" placeholder="상세 내용을 입력하세요..."></textarea></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-cancel" onclick="document.getElementById('add-tl-form').style.display='none'">취소</button>
      <button class="btn btn-save" onclick="saveTL()"><i class="ti ti-device-floppy" aria-hidden="true"></i>저장</button>
    </div>
  </div>`;
}

function renderFiles(p){
  const el=document.getElementById('tab-files');
  const files=p.files||[];
  el.innerHTML=`
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <span class="sec-label" style="margin:0;border:none;padding:0;"><i class="ti ti-paperclip" aria-hidden="true"></i>첨부파일 (${files.length})</span>
    </div>
    <div class="upload-area" onclick="document.getElementById('file-input').click()">
      <i class="ti ti-upload" aria-hidden="true"></i>
      <p>클릭하여 파일을 업로드하세요</p>
      <p style="font-size:11px;margin-top:3px;">PDF, Excel, Word, 이미지 등 모든 형식 지원</p>
    </div>
    <input type="file" id="file-input" multiple style="display:none;" onchange="handleFiles(event)"/>
    ${files.length>0?`<div class="file-list" style="margin-top:12px;">
      ${files.map(f2=>`<div class="file-item">
        <div class="file-info">
          <i class="ti ${fileIcon(f2.name)} file-icon" aria-hidden="true"></i>
          <div>
            <div class="file-name">${esc(f2.name)}</div>
            <div class="file-meta">${f2.size} · ${f2.date}</div>
          </div>
        </div>
        <button class="file-del" onclick="delFile('${f2.id}')" aria-label="삭제"><i class="ti ti-x" aria-hidden="true"></i></button>
      </div>`).join('')}
    </div>`:''}
  </div>`;
}

function fileIcon(name){
  const ext=(name||'').split('.').pop().toLowerCase();
  if(['pdf'].includes(ext))return'ti-file-type-pdf';
  if(['xlsx','xls','csv'].includes(ext))return'ti-file-spreadsheet';
  if(['docx','doc'].includes(ext))return'ti-file-word';
  if(['jpg','jpeg','png','gif','webp'].includes(ext))return'ti-photo';
  return'ti-file';
}

function f(label,val){return`<div class="field"><label>${label}</label><div class="val">${val||'—'}</div></div>`;}
function fe(label,val){return`<div class="field"><label>${label}</label><div class="val">${val?`<a href="mailto:${esc(val)}">${esc(val)}</a>`:'—'}</div></div>`;}
function fi(id,label,type,val,cls=''){return`<div class="fg ${cls}"><label>${label}</label><input id="f-${id}" type="${type}" value="${esc(val)}"/></div>`;}
function sel(id,label,val,opts){return`<div class="fg"><label>${label}</label><select id="f-${id}">${opts.map(o=>`<option value="${o[0]}" ${val===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>`;}
function gv(id){const e=document.getElementById('f-'+id);return e?e.value.trim():'';}

function openAddHistory(){document.getElementById('add-history-form').style.display='block';document.getElementById('f-h-date').value=new Date().toISOString().slice(0,10);}
function openAddTimeline(){document.getElementById('add-tl-form').style.display='block';document.getElementById('f-tl-date').value=new Date().toISOString().slice(0,10);}

async function saveHistory(){
  const p=partners.find(x=>x.id===selId);if(!p)return;
  if(!p.tradeHistory)p.tradeHistory=[];
  p.tradeHistory.unshift({id:uid(),date:gv('h-date'),type:gv('h-type'),item:gv('h-item'),qty:gv('h-qty'),unit:gv('h-unit'),amount:gv('h-amount'),note:gv('h-note')});
  await save();renderHistory(p);showToast('거래 이력이 추가됐어요');
}

async function delHistory(hid){
  const p=partners.find(x=>x.id===selId);if(!p)return;
  p.tradeHistory=(p.tradeHistory||[]).filter(h=>h.id!==hid);
  await save();renderHistory(p);showToast('삭제됐어요');
}

async function saveTL(){
  const p=partners.find(x=>x.id===selId);if(!p)return;
  if(!p.timeline)p.timeline=[];
  const detail=document.getElementById('f-tl-detail')?.value.trim()||'';
  p.timeline.unshift({id:uid(),date:gv('tl-date'),title:gv('tl-title'),detail});
  await save();renderTimeline(p);showToast('히스토리가 추가됐어요');
}

async function delTimeline(tid){
  const p=partners.find(x=>x.id===selId);if(!p)return;
  p.timeline=(p.timeline||[]).filter(t=>t.id!==tid);
  await save();renderTimeline(p);showToast('삭제됐어요');
}

async function handleFiles(e){
  const p=partners.find(x=>x.id===selId);if(!p)return;
  if(!p.files)p.files=[];
  for(const file of e.target.files){
    const sz=file.size<1024?file.size+'B':file.size<1048576?(file.size/1024).toFixed(1)+'KB':(file.size/1048576).toFixed(1)+'MB';
    p.files.push({id:uid(),name:file.name,size:sz,date:new Date().toLocaleDateString('ko-KR')});
  }
  e.target.value='';
  await save();renderFiles(p);showToast('파일이 추가됐어요');
}

async function delFile(fid){
  const p=partners.find(x=>x.id===selId);if(!p)return;
  p.files=(p.files||[]).filter(f=>f.id!==fid);
  await save();renderFiles(p);showToast('삭제됐어요');
}

function openNew(){
  selId=null;renderList();
  document.getElementById('empty-state').style.display='none';
  document.getElementById('detail-wrap').style.display='none';
  showForm(null);
}

function openEdit(){
  const p=partners.find(x=>x.id===selId);
  document.getElementById('detail-wrap').style.display='none';
  showForm(p);
}

function showForm(p){
  const isNew=!p;
  document.getElementById('form-wrap').style.display='block';
  document.getElementById('form-content').innerHTML=`
  <div class="card">
    <div class="sec-label" style="margin-top:0;"><i class="ti ti-${isNew?'plus':'edit'}" aria-hidden="true"></i>${isNew?'새 거래처 추가':'거래처 정보 편집'}</div>

    <div class="sec-label"><i class="ti ti-building" aria-hidden="true"></i>기본 정보</div>
    <div class="form-grid">
      ${fi('name','거래처명 *','text',p?.name,'full')}
      ${fi('code','거래처 코드','text',p?.code)}
      <div class="fg"><label>업종</label><select id="f-category">
        ${['도매업','소매업','제조업','무역업','서비스업','물류업','기타'].map(c=>`<option ${p?.category===c?'selected':''}>${c}</option>`).join('')}
      </select></div>
      <div class="fg"><label>거래 상태</label><select id="f-status">
        <option value="active" ${(!p||p.status==='active')?'selected':''}>거래중</option>
        <option value="pending" ${p?.status==='pending'?'selected':''}>협의중</option>
        <option value="inactive" ${p?.status==='inactive'?'selected':''}>거래중단</option>
      </select></div>
      ${fi('ceo','대표자','text',p?.ceo)}${fi('founded','설립연도','text',p?.founded)}${fi('bizNo','사업자번호','text',p?.bizNo)}${fi('address','주소','text',p?.address,'full')}
    </div>

    <div class="sec-label"><i class="ti ti-user" aria-hidden="true"></i>담당자</div>
    <div class="form-grid">
      ${fi('contact','담당자명','text',p?.contact)}${fi('ctitle','직함','text',p?.ctitle)}${fi('phone','대표전화','tel',p?.phone)}${fi('mobile','휴대폰','tel',p?.mobile)}${fi('email','이메일','email',p?.email,'full')}
    </div>

    <div class="sec-label"><i class="ti ti-coin" aria-hidden="true"></i>결제 조건</div>
    <div class="form-grid">
      ${fi('payTerms','결제 조건','text',p?.payTerms)}${fi('payMethod','결제 방법','text',p?.payMethod)}${fi('creditLimit','여신 한도','number',p?.creditLimit)}${fi('currency','통화','text',p?.currency||'KRW')}${fi('tradeStart','거래 개시일','date',p?.tradeStart)}
    </div>

    <div class="sec-label"><i class="ti ti-building-bank" aria-hidden="true"></i>은행 계좌</div>
    <div class="form-grid">
      ${fi('bank','은행명','text',p?.bank)}${fi('accountNo','계좌번호','text',p?.accountNo)}${fi('accountHolder','예금주','text',p?.accountHolder)}
    </div>

    <div class="sec-label"><i class="ti ti-ship" aria-hidden="true"></i>수출입 조건</div>
    <div class="form-grid">
      <div class="fg"><label>Incoterms</label><select id="f-incoterms">
        ${['','EXW','FCA','FAS','FOB','CFR','CIF','CPT','CIP','DAP','DPU','DDP'].map(t=>`<option ${p?.incoterms===t?'selected':''}>${t}</option>`).join('')}
      </select></div>
      ${fi('hsCode','HS 코드','text',p?.hsCode)}${fi('origin','원산지','text',p?.origin)}${fi('portLoad','선적항','text',p?.portLoad)}${fi('portDisch','도착항','text',p?.portDisch)}
    </div>

    <div class="sec-label"><i class="ti ti-notes" aria-hidden="true"></i>메모</div>

    <div class="form-actions">
      <button class="btn btn-cancel" onclick="cancelForm('${p?.id||''}')">취소</button>
      <button class="btn btn-save btn-ed" onclick="saveForm('${p?.id||''}')"><i class="ti ti-device-floppy" aria-hidden="true"></i>저장</button>
    </div>
  </div>`;
}

async function saveForm(eid){
  const name=gv('name');if(!name){alert('거래처명을 입력해주세요.');return;}
  const orig=eid?partners.find(x=>x.id===eid):null;
  const data={
    id:eid||uid(),name,code:gv('code'),category:document.getElementById('f-category').value,status:document.getElementById('f-status').value,
    ceo:gv('ceo'),founded:gv('founded'),bizNo:gv('bizNo'),address:gv('address'),
    contact:gv('contact'),ctitle:gv('ctitle'),phone:gv('phone'),mobile:gv('mobile'),email:gv('email'),
    payTerms:gv('payTerms'),payMethod:gv('payMethod'),creditLimit:gv('creditLimit'),currency:gv('currency'),tradeStart:gv('tradeStart'),
    bank:gv('bank'),accountNo:gv('accountNo'),accountHolder:gv('accountHolder'),
    incoterms:document.getElementById('f-incoterms').value,hsCode:gv('hsCode'),origin:gv('origin'),portLoad:gv('portLoad'),portDisch:gv('portDisch'),
    notes:document.getElementById('f-notes')?.value.trim()||'',
    tradeHistory:orig?.tradeHistory||[],timeline:orig?.timeline||[],files:orig?.files||[]
  };
  if(eid){const i=partners.findIndex(x=>x.id===eid);if(i>-1)partners[i]=data;}else partners.unshift(data);
  selId=data.id;curTab='info';
  await save();renderList();showDetail();showToast('저장됐어요');
}

function cancelForm(eid){
  document.getElementById('form-wrap').style.display='none';
  if(eid&&partners.find(x=>x.id===eid)){selId=eid;showDetail();}
  else{document.getElementById('empty-state').style.display='flex';}
}

async function deleteP(){
  const p=partners.find(x=>x.id===selId);if(!p)return;
  if(!confirm(`"${p.name}" 거래처를 삭제할까요?`))return;
  partners=partners.filter(x=>x.id!==selId);selId=null;
  await save();renderList();
  document.getElementById('detail-wrap').style.display='none';
  document.getElementById('empty-state').style.display='flex';
  showToast('삭제됐어요');
}

function showToast(msg){
  const t=document.getElementById('toast');
  document.getElementById('toast-msg').textContent=msg;
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);
}

load();
</script>
